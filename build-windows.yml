name: Build TyreTrack Windows
on:
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install CPU-only PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned application and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate imports, DLLs, GUI, and model
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_test.py
      - name: Build portable Windows executable
        run: python -m PyInstaller --noconfirm --clean TyreTrack.spec
      - name: Copy model alongside executable
        shell: pwsh
        run: Copy-Item tyre_detector.pt dist/TyreTrack/tyre_detector.pt
      - name: Check bundled executable starts without DLL crash
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path 'dist/TyreTrack/TyreTrack.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Packaged application exited unexpectedly with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'PASS: packaged GUI remained running for 15 seconds'
      - uses: actions/upload-artifact@v4
        with:
          name: TyreTrack-Windows-Portable
          path: dist/TyreTrack/
          if-no-files-found: error
          retention-days: 14
